name: Build and Self-Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
      
    - name: Decode Keystore
      run: |
        cat keystore.b64 | base64 --decode > release.jks
        echo "Keystore decoded"
        
    - name: Run Automated Tests
      run: |
        echo "Running Input/Output Tests..."
        gradle test
        
    - name: Build Signed APK
      run: gradle assembleRelease
      
    - name: Verify APK
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        echo "Verifying APK..."
        
        if [ ! -f "$APK" ]; then 
          echo "FAIL: APK not found"
          exit 1 
        fi
        echo "PASS: APK file exists"
        
        SIZE=$(stat -c%s "$APK")
        if [ "$SIZE" -lt 1000000 ]; then 
          echo "FAIL: APK too small"
          exit 1 
        fi
        echo "PASS: APK size valid"
        
        if jarsigner -verify "$APK" > /dev/null 2>&1; then
          echo "PASS: APK is signed"
        else
          echo "FAIL: APK signature invalid"
          exit 1
        fi
        
        echo "All tests passed!"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Viral-Hashtags-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
